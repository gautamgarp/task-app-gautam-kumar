services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: task_app_mysql
    environment:
      MYSQL_DATABASE: task_app
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - task_app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Laravel Backend (PHP-FPM)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_app_backend
    environment:
      APP_NAME: "Task Manager"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: ${APP_KEY:-base64:NotActuallyABase64String}
      
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-task_app}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-laravel}
    volumes:
      - /app/vendor
      - /app/node_modules
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - task_app_network
    command: php-fpm

  # Nginx + Frontend (Vue.js compiled)
  web:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: task_app_web
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - task_app_network
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 9000

  # Optional: Redis for caching/sessions
  redis:
    image: redis:7-alpine
    container_name: task_app_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - task_app_network

networks:
  task_app_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
